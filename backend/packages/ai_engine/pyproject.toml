[project]
name = "windup-ai-engine"
version = "0.1.0"
description = "windup 资产生产引擎:langgraph 图 / 策略 / 切片 / 后处理 / prompt"
requires-python = ">=3.12"
dependencies = [
    "windup-common",
    "windup-framework",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pillow>=10.4",
    "numpy>=1.26",
    # 视频路线后处理(strategy.walk_video / postprocess.video_frames)运行时另需:
    #   rembg>=2.0(抠图)+ imageio[ffmpeg]>=2.34 或系统 ffmpeg(抽帧)
    # 已在模块内惰性导入;上线该路线时连同 uv.lock 一起补入正式依赖。
]

[tool.uv.sources]
windup-common = { workspace = true }
windup-framework = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windup_ai_engine"]
